name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Push mới lên cùng nhánh/PR thì hủy lần chạy cũ, đỡ tốn phút miễn phí.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Test tích hợp dùng Testcontainers: runner ubuntu có sẵn Docker để chạy Postgres thật.
      - name: Test
        run: dotnet test --no-build -c Release
